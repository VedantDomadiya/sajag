[project]
name = "sajag"
version = "1.0.0"
description = "Sajag: a real-time scam-call guardian for Indian elders, powered by Gemini audio understanding."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.17.2",
    "pytest-cov>=7.1.0",
    "mypy>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "B008"]  # asserts are fine in tests/scripts; FastAPI uses call defaults

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "S603", "S607"]  # sys.path setup before imports; `say` is a fixed local binary
"app/redflags.py" = ["E501"]  # long translated sentences and keyword lists read better unwrapped

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
